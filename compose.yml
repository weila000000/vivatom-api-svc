services:
  builder:
    build: ./build-worker
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      VIVATOM_BUILDER_TOKEN: ${VIVATOM_BUILDER_TOKEN:?VIVATOM_BUILDER_TOKEN must be set}
      VIVATOM_ARTIFACT_ROOT: /artifacts
      VIVATOM_BUILDER_CONCURRENCY: ${VIVATOM_BUILDER_CONCURRENCY:-2}
      VIVATOM_PREVIEW_PORT: 8091
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - vivatom-artifacts:/artifacts
    ports:
      - "8091:8091"
    mem_limit: 512m
    pids_limit: 128
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - build
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.status===204?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  api:
    build: .
    restart: unless-stopped
    stop_grace_period: 15s
    environment:
      VIVATOM_HTTP_ADDRESS: :8080
      VIVATOM_RUNTIME_DATABASE_PATH: /app/data/vivatom.db
      VIVATOM_BUILDER_URL: http://builder:8090
      VIVATOM_BUILDER_TOKEN: ${VIVATOM_BUILDER_TOKEN:?VIVATOM_BUILDER_TOKEN must be set}
      VIVATOM_AI_PROVIDER: ${VIVATOM_AI_PROVIDER:-auto}
      VIBE_API_KEY: ${VIBE_API_KEY:-}
      VIBE_BASE_URL: ${VIBE_BASE_URL:-https://vibe.linux008.com/v1}
      VIBE_MODEL: ${VIBE_MODEL:-gpt-6-astra}
      VIVATOM_AI_ANALYST_MODEL: ${VIVATOM_AI_ANALYST_MODEL:-}
      VIVATOM_AI_ARCHITECT_MODEL: ${VIVATOM_AI_ARCHITECT_MODEL:-}
      VIVATOM_AI_BUILDER_MODEL: ${VIVATOM_AI_BUILDER_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://vibe.linux008.com/v1}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-6-astra}
    volumes:
      - vivatom-data:/app/data
    ports:
      - "8080:8080"
    depends_on:
      builder:
        condition: service_healthy
    networks:
      - default
      - build

volumes:
  vivatom-data:
  vivatom-artifacts:

networks:
  build:
    internal: true
